services:
  hayhooks:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "1416:1416"
    environment:
      HAYHOOKS_HOST: "0.0.0.0"
      HAYHOOKS_PORT: "1416"
      HAYHOOKS_PIPELINES_DIR: "/app/pipelines/definitions"
      HAYHOOKS_ADDITIONAL_PYTHON_PATH: "/app/pipelines/src"
      OLLAMA_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "gemma4:e2b"
    volumes:
      - ./pipelines/definitions:/app/pipelines/definitions:ro
      - ./pipelines/src:/app/pipelines/src
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  chainlit:
    build:
      context: .
      dockerfile: Dockerfile.chainlit
    ports:
      - "8000:8000"
    environment:
      HAYHOOKS_URL: "http://hayhooks:1416"
      HAYHOOKS_PIPELINE: "router_agent"
    volumes:
      - ./app.py:/app/app.py:ro
    depends_on:
      - hayhooks
